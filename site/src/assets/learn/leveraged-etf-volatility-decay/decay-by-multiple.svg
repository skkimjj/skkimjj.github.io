<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="378" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">기초자산은 제자리인데 — 10거래일 뒤 배율별 결과</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">하루 +10%와 −9.0909%를 5번 반복해 기초자산이 정확히 0.00%로 돌아온 경로 · 자체 예시 계산</text>

  <!-- 0선: 막대가 이 선에서 아래로 자란다 -->
  <line x1="60" y1="90" x2="660" y2="90" stroke="#c9ced6" stroke-dasharray="4 3"/>
  <text x="52" y="94" text-anchor="end" font-size="11" fill="#9aa0aa">0%</text>

  <!-- +2배 레버리지: −8.77% -> 72px 아래로 (하단만 둥근 path) -->
  <path d="M128 90 V159 A3 3 0 0 0 131 162 H211 A3 3 0 0 0 214 159 V90 Z" fill="#c0392b" fill-opacity="0.45"/>
  <text x="171" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1d24">−8.77%</text>
  <text x="171" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">+2배 레버리지</text>
  <text x="171" y="354" text-anchor="middle" font-size="11" fill="#6b7280">일간 +2배 추종</text>

  <!-- −1배 인버스: −8.77% -->
  <path d="M317 90 V159 A3 3 0 0 0 320 162 H400 A3 3 0 0 0 403 159 V90 Z" fill="#c0392b" fill-opacity="0.45"/>
  <text x="360" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1d24">−8.77%</text>
  <text x="360" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">−1배 인버스</text>
  <text x="360" y="354" text-anchor="middle" font-size="11" fill="#6b7280">일간 −1배 추종</text>

  <!-- −2배 인버스(곱버스): −24.46% -> 200px -->
  <path d="M506 90 V287 A3 3 0 0 0 509 290 H589 A3 3 0 0 0 592 287 V90 Z" fill="#c0392b"/>
  <text x="549" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">−24.46%</text>
  <text x="549" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">−2배 인버스(곱버스)</text>
  <text x="549" y="354" text-anchor="middle" font-size="11" fill="#c0392b">일간 −2배 추종</text>

  <text x="360" y="374" text-anchor="middle" font-size="11" fill="#9aa0aa">※ 보수·거래비용·추적오차를 뺀 본 사이트 자체 예시 계산이며 특정 상품의 실제 수익률이 아닙니다</text>
</svg>
