<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="378" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">SK하이닉스 ADR 괴리율 추이 (프리미엄, +)</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">전환 창구가 한 방향일 때의 프리미엄 · 개장 전 브리핑 괴리율 트래커 기준</text>

  <!-- baseline (0%) -->
  <line x1="52" y1="300" x2="668" y2="300" stroke="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0%</text>

  <!-- 07/16 : +38.5 -->
  <rect x="74" y="100" width="62" height="200" rx="3" fill="#7ea6d4"/>
  <text x="105" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">+38.5</text>
  <text x="105" y="322" text-anchor="middle" font-size="13" fill="#4b5563">07/16</text>

  <!-- 07/20 : +24.4 -->
  <rect x="174" y="173" width="62" height="127" rx="3" fill="#7ea6d4"/>
  <text x="205" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">+24.4</text>
  <text x="205" y="322" text-anchor="middle" font-size="13" fill="#4b5563">07/20</text>

  <!-- 07/22 : +38.0 -->
  <rect x="274" y="103" width="62" height="197" rx="3" fill="#7ea6d4"/>
  <text x="305" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">+38.0</text>
  <text x="305" y="322" text-anchor="middle" font-size="13" fill="#4b5563">07/22</text>

  <!-- 07/24 : +29.6 -->
  <rect x="374" y="146" width="62" height="154" rx="3" fill="#7ea6d4"/>
  <text x="405" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">+29.6</text>
  <text x="405" y="322" text-anchor="middle" font-size="13" fill="#4b5563">07/24</text>

  <!-- 07/27 : +28.9 -->
  <rect x="474" y="150" width="62" height="150" rx="3" fill="#7ea6d4"/>
  <text x="505" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">+28.9</text>
  <text x="505" y="322" text-anchor="middle" font-size="13" fill="#4b5563">07/27</text>

  <!-- 07/28 : +15.7 (최신) -->
  <rect x="574" y="218" width="62" height="82" rx="3" fill="#1f5fa8"/>
  <text x="605" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#1f5fa8">+15.7</text>
  <text x="605" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">07/28</text>

  <text x="360" y="348" text-anchor="middle" font-size="11" fill="#6b7280">괴리율 = (ADR 종가 × 10 × 원/달러 환율 − 본주 종가) ÷ 본주 종가 × 100 · 날짜는 브리핑 발행일</text>
  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">※ 실시간 변동하는 값입니다. 방향을 예측하는 지표가 아닙니다.</text>
</svg>
