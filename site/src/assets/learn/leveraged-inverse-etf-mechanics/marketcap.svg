  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">단위: 조원 · 금융위원회 보도자료(2026년 7월 16일)의 단일종목 레버리지 상품(ETF·ETN) 시가총액</text>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#9aa0aa">증가에는 자금 유입과 기초자산 가격 상승이 함께 작용했습니다 · 7월 16일부터 신규 상장 잠정 중단</text>
