  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">2026년 7월 16일 금융위원회 보완방안 보도자료 기준</text>

  <!-- baseline (0) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 5월 27일 : 4.4조원 -->
  <path d="M180 300 V229 A3 3 0 0 1 183 226 H297 A3 3 0 0 1 300 229 V300 Z" fill="#7ea6d4"/>
  <text x="240" y="211" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">4.4조원</text>
  <text x="240" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">5월 27일</text>
  <text x="240" y="341" text-anchor="middle" font-size="11" fill="#6b7280">첫 상장(18종)</text>

