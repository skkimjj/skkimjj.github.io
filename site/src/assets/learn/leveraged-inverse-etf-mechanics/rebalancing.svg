<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">기초자산이 하루 +5% 오른 날, 장 마감 무렵 필요한 재조정 거래</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">순자산 100만원 기준 자체 예시 계산 · 오른 날엔 세 상품 모두 '사는' 방향</text>

  <!-- baseline (0) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- +2배 : 10만원 추가 매수 -->
  <path d="M117 300 V236 A3 3 0 0 1 120 233 H210 A3 3 0 0 1 213 236 V300 Z" fill="#7ea6d4"/>
  <text x="165" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">10만원</text>
  <text x="165" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">+2배</text>
  <text x="165" y="341" text-anchor="middle" font-size="11" fill="#6b7280">추가 매수</text>

  <!-- -1배 : 10만원 되사기 -->
  <path d="M312 300 V236 A3 3 0 0 1 315 233 H405 A3 3 0 0 1 408 236 V300 Z" fill="#7ea6d4"/>
  <text x="360" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">10만원</text>
  <text x="360" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">-1배</text>
  <text x="360" y="341" text-anchor="middle" font-size="11" fill="#6b7280">매도분 되사기</text>

  <!-- -2배(곱버스) : 30만원 되사기 -->
  <path d="M507 300 V103 A3 3 0 0 1 510 100 H600 A3 3 0 0 1 603 103 V300 Z" fill="#1f5fa8"/>
  <text x="555" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">30만원</text>
  <text x="555" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">-2배(곱버스)</text>
  <text x="555" y="341" text-anchor="middle" font-size="11" fill="#1f5fa8">매도분 되사기 — 2배 상품의 3배</text>

  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">단위: 만원 · 목표배율 유지를 가정한 자체 예시 계산이며 특정 상품의 실제 거래가 아닙니다</text>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#9aa0aa">-1배: 순자산 95만원·매도 105만원 → 95만원으로 축소 · -2배: 순자산 90만원·매도 210만원 → 180만원으로 축소</text>
</svg>
