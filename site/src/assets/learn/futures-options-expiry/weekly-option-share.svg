  <text x="360" y="362" text-anchor="middle" font-size="11" fill="#9aa0aa">위클리 옵션 일평균 거래량 ÷ 코스피200 옵션(월물+위클리) 일평균 거래량 · 2019년은 9월 23일 상장 이후</text>
