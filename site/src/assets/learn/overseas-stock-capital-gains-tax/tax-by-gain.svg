<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">양도차익별 실제 납부세액 — 250만원을 뺀 나머지에만 22%</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">(양도차익 − 기본공제 250만원) × 22%로 계산한 자체 산출 예시</text>

  <!-- baseline (0) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 막대는 위쪽만 둥글게(r=3), 하단은 직각으로 기준선에 딱 맞춘다 -->
  <!-- 차익 250만원 : 세금 0원 (막대 없음) -->
  <text x="146" y="291" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">0원</text>
  <text x="146" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">차익 250만원</text>
  <text x="146" y="342" text-anchor="middle" font-size="11" fill="#6b7280">공제로 전액 상쇄</text>

  <!-- 차익 500만원 : 55만원 -->
  <path d="M240 300 V285 A3 3 0 0 1 243 282 H333 A3 3 0 0 1 336 285 V300 Z" fill="#7ea6d4"/>
  <text x="288" y="267" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">55만원</text>
  <text x="288" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">차익 500만원</text>

  <!-- 차익 1,000만원 : 165만원 -->
  <path d="M382 300 V249 A3 3 0 0 1 385 246 H475 A3 3 0 0 1 478 249 V300 Z" fill="#7ea6d4"/>
  <text x="430" y="231" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">165만원</text>
  <text x="430" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">차익 1,000만원</text>

  <!-- 차익 3,000만원 : 605만원 -->
  <path d="M524 300 V103 A3 3 0 0 1 527 100 H617 A3 3 0 0 1 620 103 V300 Z" fill="#1f5fa8"/>
  <text x="572" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">605만원</text>
  <text x="572" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">차익 3,000만원</text>

  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">단위: 원 · 세율 22%(양도소득세 20% ＋ 지방소득세 2%) · 필요경비와 다른 계좌의 손익은 없다고 가정</text>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#9aa0aa">특정 수익률을 전망하는 계산이 아니라 세액 구조만 보기 위한 예시입니다</text>
</svg>
