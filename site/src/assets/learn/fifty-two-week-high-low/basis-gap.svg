<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">삼성전자 52주 신고가일 — 기준에 따라 달라진다</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">2025년 9월 17일~2026년 9월 16일 · 일별 시세로 직접 계산 · 단위: 일</text>

  <!-- 기준선 — 막대 아래에만 놓는다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 막대는 기준선에서 위로 자라고, 위쪽만 둥글게(r=3) 한다 -->
  <!-- 두 기준 모두 신고가 43일 -->
  <path d="M120 300 V93 A3 3 0 0 1 123 90 H227 A3 3 0 0 1 230 93 V300 Z" fill="#1f5faa"/>
  <text x="175" y="80" text-anchor="middle" font-size="17" font-weight="700" fill="#1f5faa">43일</text>
  <text x="175" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">두 기준 모두</text>
  <text x="175" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">신고가</text>

  <!-- 장중(고가) 기준으로만 12일 -->
  <path d="M305 300 V244 A3 3 0 0 1 308 241 H412 A3 3 0 0 1 415 244 V300 Z" fill="#1f5faa" fill-opacity="0.4"/>
  <text x="360" y="231" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1d24">12일</text>
  <text x="360" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">장중(고가) 기준</text>
  <text x="360" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">으로만 신고가</text>

  <!-- 종가 기준으로만 13일 -->
  <path d="M490 300 V239 A3 3 0 0 1 493 236 H597 A3 3 0 0 1 600 239 V300 Z" fill="#1f5faa" fill-opacity="0.4"/>
  <text x="545" y="226" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1d24">13일</text>
  <text x="545" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">종가 기준</text>
  <text x="545" y="340" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">으로만 신고가</text>

  <text x="360" y="370" text-anchor="middle" font-size="12" fill="#6b7280">어느 쪽으로든 신고가로 걸린 날 68일 중 25일(약 37%)에서 두 기준이 엇갈렸습니다</text>
  <text x="360" y="388" text-anchor="middle" font-size="11" fill="#9aa0aa">각 날짜를 직전 364일(52주)의 고가 최댓값·종가 최댓값과 각각 비교 · 종목의 우열이나 향후 주가 판단이 아닙니다</text>
</svg>
