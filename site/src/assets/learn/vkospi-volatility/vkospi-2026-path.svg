  <text x="100" y="204" font-size="11" fill="#9aa0aa">40</text>

  <!-- 경로: 1/2 30.60 · 6/1 74.22 · 6/29 96.94 · 7/29 87.79 · 8/28 50.08 · 9/23 42.98 (가로 간격은 날짜에 비례) -->
  <polyline points="112,229 417,142 473,96 534,114 595,190 648,204" fill="none" stroke="#1f5fa8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="112" cy="229" r="5" fill="#1f5fa8"/>
  <text x="112" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">30.60</text>
  <circle cx="417" cy="142" r="5" fill="#1f5fa8"/>
  <text x="404" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">74.22</text>
  <circle cx="473" cy="96" r="5" fill="#1f5fa8"/>
  <text x="473" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">96.94</text>
  <circle cx="534" cy="114" r="5" fill="#1f5fa8"/>
  <text x="540" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">87.79</text>
