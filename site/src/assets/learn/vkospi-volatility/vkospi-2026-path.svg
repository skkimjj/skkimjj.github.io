<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">2026년 VKOSPI 종가 — 주요 시점</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">6월 29일 최고 종가 96.94에서 9월 23일 42.98까지 절반 넘게 내려왔지만, 줄곧 40 위였다</text>

  <!-- 눈금선: y = 290 - 2 × 값 (100 → 90, 0 → 290) -->
  <rect x="92" y="90" width="576" height="1" fill="#e5e7eb"/>
  <rect x="92" y="140" width="576" height="1" fill="#e5e7eb"/>
  <rect x="92" y="190" width="576" height="1" fill="#e5e7eb"/>
  <rect x="92" y="240" width="576" height="1" fill="#e5e7eb"/>
  <rect x="92" y="290" width="576" height="1" fill="#c9ced6"/>
  <text x="84" y="94" text-anchor="end" font-size="12" fill="#9aa0aa">100</text>
  <text x="84" y="144" text-anchor="end" font-size="12" fill="#9aa0aa">75</text>
  <text x="84" y="194" text-anchor="end" font-size="12" fill="#9aa0aa">50</text>
  <text x="84" y="244" text-anchor="end" font-size="12" fill="#9aa0aa">25</text>
  <text x="84" y="294" text-anchor="end" font-size="12" fill="#9aa0aa">0</text>

  <!-- 40 기준선(언론이 '공포 구간' 경계로 쓰는 값) -->
