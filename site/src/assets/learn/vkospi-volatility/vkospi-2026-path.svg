  <text x="473" y="312" text-anchor="middle" font-size="12" fill="#6b7280">6/29</text>
  <text x="534" y="312" text-anchor="middle" font-size="12" fill="#6b7280">7/29</text>
  <text x="595" y="312" text-anchor="middle" font-size="12" fill="#6b7280">8/28</text>
  <text x="648" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#1f5fa8">9/23</text>

  <text x="360" y="352" text-anchor="middle" font-size="11" fill="#9aa0aa">세로축 = VKOSPI 종가 · 점선 = 40 · 1/2·6/1·6/29는 언론 보도, 7월 이후는 본 공부방 브리핑 기록과 Investing.com 대조</text>
  <text x="360" y="370" text-anchor="middle" font-size="11" fill="#9aa0aa">6월 29일 96.94는 한국거래소 공식 발표(2009년 4월 13일) 이후 최고 종가</text>
</svg>
