  <text x="360" y="372" text-anchor="middle" font-size="11" fill="#9aa0aa">⚠️ 모집단이 다릅니다 — 평균 3개는 한국은행 「2025년 기업경영분석(속보)」의 외부감사대상 비금융 영리법인 34,456곳,</text>
  <text x="360" y="388" text-anchor="middle" font-size="11" fill="#9aa0aa">맨 왼쪽은 상장사 한 곳의 연결 기준 값입니다. 우열 비교가 아니라 기준선의 폭을 보는 그래프입니다.</text>
