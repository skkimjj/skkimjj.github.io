  <text x="360" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">나스닥100</text>
  <text x="360" y="354" text-anchor="middle" font-size="11" fill="#6b7280">TIGER 미국나스닥100</text>

  <!-- S&P500: -4.29 -> 37px -->
