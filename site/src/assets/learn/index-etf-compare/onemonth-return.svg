  <text x="549" y="354" text-anchor="middle" font-size="11" fill="#6b7280">TIGER 미국S&amp;P500</text>

  <text x="360" y="374" text-anchor="middle" font-size="11" fill="#9aa0aa">※ 짧은 구간의 수익률로 우열을 판단할 수 없습니다. 1년으로 넓히면 순서가 달라진 구간도 있습니다.</text>
