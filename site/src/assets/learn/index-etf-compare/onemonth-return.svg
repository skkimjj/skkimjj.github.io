  <text x="171" y="354" text-anchor="middle" font-size="11" fill="#6b7280">KODEX 200</text>

  <!-- 나스닥100: -7.78 -> 68px -->
  <rect x="317" y="90" width="86" height="68" rx="3" fill="#c0392b" fill-opacity="0.45"/>
