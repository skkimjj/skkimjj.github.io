<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">ADR 구간으로 날을 나눠도 20거래일 뒤는 비슷했습니다</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">막대 = 20거래일 뒤 코스피 종가가 그날보다 높았던 날의 비율(%)</text>

  <!-- baseline (0) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 75 이하(바닥권) : 59% -->
  <path d="M70 300 V185 A3 3 0 0 1 73 182 H177 A3 3 0 0 1 180 185 V300 Z" fill="#7ea6d4"/>
  <text x="125" y="170" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">59%</text>
  <text x="125" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">75 이하</text>
  <text x="125" y="342" text-anchor="middle" font-size="10" fill="#6b7280">'바닥권' · 252일</text>

  <!-- 75~120(중간) : 58% -->
  <path d="M220 300 V187 A3 3 0 0 1 223 184 H327 A3 3 0 0 1 330 187 V300 Z" fill="#7ea6d4"/>
  <text x="275" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">58%</text>
  <text x="275" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">75~120</text>
  <text x="275" y="342" text-anchor="middle" font-size="10" fill="#6b7280">1,283일</text>

  <!-- 120 이상(과열권) : 55% -->
  <path d="M370 300 V193 A3 3 0 0 1 373 190 H477 A3 3 0 0 1 480 193 V300 Z" fill="#7ea6d4"/>
  <text x="425" y="178" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">55%</text>
  <text x="425" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">120 이상</text>
  <text x="425" y="342" text-anchor="middle" font-size="10" fill="#6b7280">'과열권' · 163일</text>

  <!-- 전체 : 58% -->
  <path d="M520 300 V187 A3 3 0 0 1 523 184 H627 A3 3 0 0 1 630 187 V300 Z" fill="#1f5fa8"/>
  <text x="575" y="172" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">58%</text>
  <text x="575" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">전체</text>
  <text x="575" y="342" text-anchor="middle" font-size="10" fill="#1f5fa8">1,698일</text>

  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">표본 = 2019년 9월 23일~2026년 9월 21일 중 20거래일 뒤 종가가 있는 코스피 1,698거래일 · 본 공부방 자체 계산</text>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#9aa0aa">지나간 기록을 센 것이며 앞으로의 지수 방향을 뜻하지 않습니다</text>
</svg>
