<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">퇴직연금 계좌에서 만들 수 있는 실질 주식 비중</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">위험자산 한도 70%를 주식형으로 채우고, 남은 30%를 무엇으로 채우느냐에 따라</text>

  <!-- baseline (0) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 예금으로 채운 경우 : 70% -->
  <path d="M105 300 V138 A3 3 0 0 1 108 135 H212 A3 3 0 0 1 215 138 V300 Z" fill="#7ea6d4"/>
  <text x="160" y="121" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">70%</text>
  <text x="160" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">안전자산 30%를</text>
  <text x="160" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">예금으로</text>
  <text x="160" y="360" text-anchor="middle" font-size="11" fill="#6b7280">70 + 30 × 0</text>

  <!-- 단일종목 채권혼합(주식 30%) : 79% -->
  <path d="M305 300 V117 A3 3 0 0 1 308 114 H412 A3 3 0 0 1 415 117 V300 Z" fill="#7ea6d4"/>
  <text x="360" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">79%</text>
  <text x="360" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">단일종목 채권혼합</text>
  <text x="360" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">(주식 30%)으로</text>
  <text x="360" y="360" text-anchor="middle" font-size="11" fill="#6b7280">70 + 30 × 0.30</text>

  <!-- 2종목·지수형 채권혼합50(주식 50%) : 85% -->
  <path d="M505 300 V103 A3 3 0 0 1 508 100 H612 A3 3 0 0 1 615 103 V300 Z" fill="#1f5fa8"/>
  <text x="560" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">85%</text>
  <text x="560" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">2종목·지수형 채권혼합50</text>
  <text x="560" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">(주식 50%)으로</text>
  <text x="560" y="360" text-anchor="middle" font-size="11" fill="#1f5fa8">70 + 30 × 0.50</text>

  <text x="360" y="384" text-anchor="middle" font-size="11" fill="#9aa0aa">단위: 계좌 전체 대비 % · 퇴직연금감독규정상 위험자산 한도 70%와 채권혼합형 안전자산 요건에 근거한 계산값 · 편입 가능 상품은 퇴직연금 사업자마다 다릅니다</text>
</svg>
