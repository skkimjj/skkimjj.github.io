<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">주요국 주식 결제주기 — 한국은 아직 2거래일입니다</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">2026년 9월 기준 · 체결일로부터 결제까지 걸리는 거래일 수</text>

  <!-- 기준선 — 막대 아래에만 놓는다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>

  <!-- 막대는 기준선에서 위로 자라고, 위쪽만 둥글게(r=3) 한다 -->
  <!-- 한국 2거래일 -->
  <path d="M79 300 V103 A3 3 0 0 1 82 100 H176 A3 3 0 0 1 179 103 V300 Z" fill="#0f4bd8"/>
  <text x="129" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#0f4bd8">2거래일</text>
  <text x="129" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#0f4bd8">한국</text>
  <text x="129" y="340" text-anchor="middle" font-size="11" fill="#0f4bd8">T+1 전환 논의 중</text>

  <!-- 일본 2거래일 -->
  <path d="M233 300 V103 A3 3 0 0 1 236 100 H330 A3 3 0 0 1 333 103 V300 Z" fill="#0f4bd8" fill-opacity="0.4"/>
  <text x="283" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1d24">2거래일</text>
  <text x="283" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">일본</text>
  <text x="283" y="340" text-anchor="middle" font-size="11" fill="#6b7280">검토 단계</text>

  <!-- 미국 1거래일 -->
  <path d="M387 300 V203 A3 3 0 0 1 390 200 H484 A3 3 0 0 1 487 203 V300 Z" fill="#0f4bd8" fill-opacity="0.4"/>
  <text x="437" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1d24">1거래일</text>
  <text x="437" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">미국</text>
  <text x="437" y="340" text-anchor="middle" font-size="11" fill="#6b7280">2024년 5월 전환</text>

  <!-- 인도 1거래일 -->
  <path d="M541 300 V203 A3 3 0 0 1 544 200 H638 A3 3 0 0 1 641 203 V300 Z" fill="#0f4bd8" fill-opacity="0.4"/>
  <text x="591" y="188" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1d24">1거래일</text>
  <text x="591" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">인도</text>
  <text x="591" y="340" text-anchor="middle" font-size="11" fill="#6b7280">2023년 1월 전환</text>

  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">단위: 거래일 · 유럽연합·영국·스위스는 2027년 10월 11일 T+1 공동 전환 목표</text>
  <text x="360" y="384" text-anchor="middle" font-size="11" fill="#9aa0aa">어느 쪽이 낫다는 판단이 아니라 제도 차이를 보여 주는 그림입니다</text>
</svg>
