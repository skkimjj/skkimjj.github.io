<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">2026년 추석 연휴 전후 — 매도 대금 결제까지 걸리는 달력 일수</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">네 경우 모두 똑같은 T+2 결제 · 사이에 낀 휴장일 수만 다릅니다</text>

  <!-- 기준선 — 막대 아래에만 놓는다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>

  <!-- 막대는 기준선에서 위로 자라고, 위쪽만 둥글게(r=3) 한다 -->
  <!-- 9/18 금 → 9/22 결제, 4일 -->
  <path d="M79 300 V170 A3 3 0 0 1 82 167 H176 A3 3 0 0 1 179 170 V300 Z" fill="#0f4bd8" fill-opacity="0.4"/>
  <text x="129" y="155" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1d24">4일</text>
  <text x="129" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">9/18 금 매도</text>
  <text x="129" y="340" text-anchor="middle" font-size="11" fill="#6b7280">→ 9/22 화 결제</text>

  <!-- 9/21 월 → 9/23 결제, 2일 -->
  <path d="M233 300 V236 A3 3 0 0 1 236 233 H330 A3 3 0 0 1 333 236 V300 Z" fill="#0f4bd8" fill-opacity="0.4"/>
  <text x="283" y="221" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1d24">2일</text>
  <text x="283" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">9/21 월 매도</text>
  <text x="283" y="340" text-anchor="middle" font-size="11" fill="#6b7280">→ 9/23 수 결제</text>

  <!-- 9/22 화 → 9/28 결제, 6일 -->
  <path d="M387 300 V103 A3 3 0 0 1 390 100 H484 A3 3 0 0 1 487 103 V300 Z" fill="#0f4bd8" fill-opacity="0.4"/>
  <text x="437" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1d24">6일</text>
  <text x="437" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">9/22 화 매도</text>
  <text x="437" y="340" text-anchor="middle" font-size="11" fill="#6b7280">→ 9/28 월 결제</text>

  <!-- 9/23 수 → 9/29 결제, 6일 -->
  <path d="M541 300 V103 A3 3 0 0 1 544 100 H638 A3 3 0 0 1 641 103 V300 Z" fill="#0f4bd8"/>
  <text x="591" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#0f4bd8">6일</text>
  <text x="591" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#0f4bd8">9/23 수 매도</text>
  <text x="591" y="340" text-anchor="middle" font-size="11" fill="#0f4bd8">→ 9/29 화 결제</text>

  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">단위: 일(달력 기준) · 2026년 9월 24일(목)·25일(금) 한국거래소 휴장 기준 자체 계산</text>
  <text x="360" y="384" text-anchor="middle" font-size="11" fill="#9aa0aa">거래일 간격은 네 경우 모두 2거래일로 같습니다 · 실제 입금 시각은 증권사에 따라 다릅니다</text>
</svg>
