<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">KRX Open API 부문별 무료 서비스 수 (주요 5개 부문)</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">인증키만 발급받으면 무료로 호출할 수 있는 서비스 개수</text>

  <!-- baseline (0) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 주식 8종 -->
  <path d="M90 300 V103 A3 3 0 0 1 93 100 H171 A3 3 0 0 1 174 103 V300 Z" fill="#1f5fa8"/>
  <text x="132" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">8종</text>
  <text x="132" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">주식</text>
  <text x="132" y="341" text-anchor="middle" font-size="11" fill="#1f5fa8">시세·종목기본정보</text>

  <!-- 파생상품 6종 -->
  <path d="M204 300 V153 A3 3 0 0 1 207 150 H285 A3 3 0 0 1 288 153 V300 Z" fill="#7ea6d4"/>
  <text x="246" y="135" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">6종</text>
  <text x="246" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">파생상품</text>

  <!-- 지수 5종 -->
  <path d="M318 300 V178 A3 3 0 0 1 321 175 H399 A3 3 0 0 1 402 178 V300 Z" fill="#7ea6d4"/>
  <text x="360" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">5종</text>
  <text x="360" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">지수</text>

  <!-- 증권상품 3종 -->
  <path d="M432 300 V228 A3 3 0 0 1 435 225 H513 A3 3 0 0 1 516 228 V300 Z" fill="#7ea6d4"/>
  <text x="474" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">3종</text>
  <text x="474" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">증권상품</text>
  <text x="474" y="341" text-anchor="middle" font-size="11" fill="#6b7280">ETF·ETN·ELW</text>

  <!-- 채권 3종 -->
  <path d="M546 300 V228 A3 3 0 0 1 549 225 H627 A3 3 0 0 1 630 228 V300 Z" fill="#7ea6d4"/>
  <text x="588" y="210" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">3종</text>
  <text x="588" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">채권</text>

  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">단위: 종(서비스 수) · KRX Open API 서비스 목록 페이지를 2026년 8월 8일 직접 집계</text>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#9aa0aa">이 밖에 일반상품 3종·ESG 3종이 있어 전체는 7개 부문 31종입니다</text>
</svg>
