<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">기업 실적은 언제 DART에 올라오나 — 정기보고서 제출기한</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">결산기가 끝난 뒤 며칠 안에 제출해야 하는지 (자본시장법)</text>

  <!-- baseline (0) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 분기보고서 45일 -->
  <path d="M98 300 V203 A3 3 0 0 1 101 200 H191 A3 3 0 0 1 194 203 V300 Z" fill="#7ea6d4"/>
  <text x="146" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">45일</text>
  <text x="146" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">분기보고서</text>

  <!-- 반기보고서 45일 -->
  <path d="M240 300 V203 A3 3 0 0 1 243 200 H333 A3 3 0 0 1 336 203 V300 Z" fill="#7ea6d4"/>
  <text x="288" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">45일</text>
  <text x="288" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">반기보고서</text>

  <!-- 연결기준 최초 제출 예외 60일 -->
  <path d="M382 300 V170 A3 3 0 0 1 385 167 H475 A3 3 0 0 1 478 170 V300 Z" fill="#7ea6d4"/>
  <text x="430" y="152" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">60일</text>
  <text x="430" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">연결기준</text>
  <text x="430" y="341" text-anchor="middle" font-size="11" fill="#6b7280">최초 제출 예외</text>

  <!-- 사업보고서 90일 -->
  <path d="M524 300 V103 A3 3 0 0 1 527 100 H617 A3 3 0 0 1 620 103 V300 Z" fill="#1f5fa8"/>
  <text x="572" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">90일</text>
  <text x="572" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">사업보고서(연간)</text>
  <text x="572" y="341" text-anchor="middle" font-size="11" fill="#1f5fa8">12월 결산 → 3/31</text>

  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">단위: 일 · 자본시장법상 정기보고서 제출기한, 2026년 8월 DART 공시업무 스케줄 확인</text>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#9aa0aa">연결기준 분·반기보고서를 최초 제출하는 최초 사업연도와 그 다음 사업연도에 한해 60일</text>
</svg>
