<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">같은 1틱인데 주가 대비 비중은 5배 차이</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">호가가격단위 구간 경계를 넘으면 최소 가격 변동폭이 갑자기 5배로 커집니다</text>

  <!-- baseline (0%) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 막대는 위쪽만 둥글게(r=3), 하단은 직각으로 기준선에 딱 맞춘다 -->
  <!-- 19,990원 : 0.050% -->
  <path d="M99 300 V263 A3 3 0 0 1 102 260 H186 A3 3 0 0 1 189 263 V300 Z" fill="#7ea6d4"/>
  <text x="144" y="248" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">0.050%</text>
  <text x="144" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">19,990원</text>
  <text x="144" y="342" text-anchor="middle" font-size="11" fill="#6b7280">1틱 10원</text>

  <!-- 20,000원 : 0.250% -->
  <path d="M246 300 V103 A3 3 0 0 1 249 100 H333 A3 3 0 0 1 336 103 V300 Z" fill="#1f5fa8"/>
  <text x="291" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">0.250%</text>
  <text x="291" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">20,000원</text>
  <text x="291" y="342" text-anchor="middle" font-size="11" fill="#1f5fa8">1틱 50원</text>

  <!-- 199,900원 : 0.050% -->
  <path d="M394 300 V263 A3 3 0 0 1 397 260 H481 A3 3 0 0 1 484 263 V300 Z" fill="#7ea6d4"/>
  <text x="439" y="248" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">0.050%</text>
  <text x="439" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">199,900원</text>
  <text x="439" y="342" text-anchor="middle" font-size="11" fill="#6b7280">1틱 100원</text>

  <!-- 200,000원 : 0.250% -->
  <path d="M541 300 V103 A3 3 0 0 1 544 100 H628 A3 3 0 0 1 631 103 V300 Z" fill="#1f5fa8"/>
  <text x="586" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">0.250%</text>
  <text x="586" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">200,000원</text>
  <text x="586" y="342" text-anchor="middle" font-size="11" fill="#1f5fa8">1틱 500원</text>

  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">단위: % (1틱 ÷ 주가) · 한국거래소 호가가격단위(2023년 1월 25일 시행, 2026년 8월 확인) 기준 자체 계산</text>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#9aa0aa">예시 가격은 구간 경계를 보여 주기 위한 값이며 특정 종목의 실제 주가가 아닙니다</text>
</svg>
