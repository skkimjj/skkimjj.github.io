<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">20,000원 종목을 사서 즉시 되팔 때 드는 최소 비용</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">주가가 1원도 움직이지 않아도 약 0.45%가 사라집니다</text>

  <!-- baseline (0%) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 막대는 위쪽만 둥글게(r=3), 하단은 직각으로 기준선에 딱 맞춘다 -->
  <!-- 호가 스프레드 : 0.25% -->
  <path d="M118 300 V186 A3 3 0 0 1 121 183 H229 A3 3 0 0 1 232 186 V300 Z" fill="#7ea6d4"/>
  <text x="175" y="171" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">0.25%</text>
  <text x="175" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">호가 스프레드</text>
  <text x="175" y="342" text-anchor="middle" font-size="11" fill="#6b7280">1틱 50원</text>

  <!-- 증권거래세 : 0.20% -->
  <path d="M306 300 V210 A3 3 0 0 1 309 207 H417 A3 3 0 0 1 420 210 V300 Z" fill="#7ea6d4"/>
  <text x="363" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">0.20%</text>
  <text x="363" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">증권거래세</text>
  <text x="363" y="342" text-anchor="middle" font-size="11" fill="#6b7280">매도 시</text>

  <!-- 합계 : 0.45% -->
  <path d="M494 300 V93 A3 3 0 0 1 497 90 H605 A3 3 0 0 1 608 93 V300 Z" fill="#1f5fa8"/>
  <text x="551" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">0.45%</text>
  <text x="551" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">합계</text>
  <text x="551" y="342" text-anchor="middle" font-size="11" fill="#1f5fa8">수수료 별도</text>

  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">매수 20,050원 → 매도 20,000원 → 거래세 40원 = 손실 90원(매수금액의 약 0.45%)</text>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#9aa0aa">호가가격단위 2026년 8월 기준 · 증권거래세율 2026년 1월 1일 시행 기준 자체 계산 · 위탁수수료 제외</text>
</svg>
