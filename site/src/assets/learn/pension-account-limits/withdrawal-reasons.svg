<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">퇴직연금 중도인출 사유 — 열에 여덟이 집 문제</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">2024년 중도인출 6만 7,000명의 인출 사유 (인원 기준)</text>

  <!-- baseline (0%) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 막대는 위쪽만 둥글게(r=3), 하단은 직각으로 기준선에 딱 맞춘다 -->
  <!-- 주택구입 : 56.5% -->
  <path d="M99 300 V93 A3 3 0 0 1 102 90 H186 A3 3 0 0 1 189 93 V300 Z" fill="#1f5fa8"/>
  <text x="144" y="75" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">56.5%</text>
  <text x="144" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">주택구입</text>
  <text x="144" y="342" text-anchor="middle" font-size="11" fill="#1f5fa8">3만 8,000명</text>

  <!-- 주거임차 : 25.5% -->
  <path d="M246 300 V208 A3 3 0 0 1 249 205 H333 A3 3 0 0 1 336 208 V300 Z" fill="#1f5fa8"/>
  <text x="291" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">25.5%</text>
  <text x="291" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">주거임차</text>
  <text x="291" y="342" text-anchor="middle" font-size="11" fill="#1f5fa8">1만 7,000명</text>

  <!-- 회생절차 : 13.1% -->
  <path d="M394 300 V254 A3 3 0 0 1 397 251 H481 A3 3 0 0 1 484 254 V300 Z" fill="#7ea6d4"/>
  <text x="439" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">13.1%</text>
  <text x="439" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">회생절차</text>
  <text x="439" y="342" text-anchor="middle" font-size="11" fill="#6b7280">8,727명</text>

  <!-- 그 밖 : 4.9% -->
  <path d="M541 300 V285 A3 3 0 0 1 544 282 H628 A3 3 0 0 1 631 285 V300 Z" fill="#a9b3bf"/>
  <text x="586" y="267" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">4.9%</text>
  <text x="586" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">그 밖</text>
  <text x="586" y="342" text-anchor="middle" font-size="11" fill="#6b7280">장기요양 등</text>

  <text x="360" y="372" text-anchor="middle" font-size="11" fill="#6b7280">진한 막대(주택구입＋주거임차 82.0%)는 소득세법상 '부득이한 사유'가 아니어서 세율 감면을 받지 못합니다</text>
  <text x="360" y="388" text-anchor="middle" font-size="11" fill="#6b7280">단위: % · 자료: 국가데이터처 「2024년 퇴직연금통계」(2025-12-15 발표) · '그 밖'은 100%에서 앞 세 항목을 뺀 직접 계산</text>
</svg>
