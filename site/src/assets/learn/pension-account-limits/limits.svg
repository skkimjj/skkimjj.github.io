<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">한도는 1,800만원인데, 실제 평균 납입액은 161만원</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">넣을 수 있는 한도와 세금을 깎아주는 한도는 다른 숫자입니다</text>

  <!-- baseline (0) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 막대는 위쪽만 둥글게(r=3), 하단은 직각으로 기준선에 딱 맞춘다 -->
  <!-- 납입한도 : 1,800만원 -->
  <path d="M99 300 V93 A3 3 0 0 1 102 90 H186 A3 3 0 0 1 189 93 V300 Z" fill="#7ea6d4"/>
  <text x="144" y="75" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">1,800만원</text>
  <text x="144" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">납입한도</text>
  <text x="144" y="342" text-anchor="middle" font-size="11" fill="#6b7280">연금저축＋IRP 합산</text>

  <!-- 세액공제 한도(합산) : 900만원 -->
  <path d="M246 300 V198 A3 3 0 0 1 249 195 H333 A3 3 0 0 1 336 198 V300 Z" fill="#1f5fa8"/>
  <text x="291" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">900만원</text>
  <text x="291" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">세액공제 한도</text>
  <text x="291" y="342" text-anchor="middle" font-size="11" fill="#1f5fa8">연금저축＋IRP 합산</text>

  <!-- 세액공제 한도(연금저축 몫) : 600만원 -->
  <path d="M394 300 V233 A3 3 0 0 1 397 230 H481 A3 3 0 0 1 484 233 V300 Z" fill="#7ea6d4"/>
  <text x="439" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">600만원</text>
  <text x="439" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">세액공제 한도</text>
  <text x="439" y="342" text-anchor="middle" font-size="11" fill="#6b7280">연금저축 몫</text>

  <!-- 실제 평균 납입액 : 161만원 -->
  <path d="M541 300 V284 A3 3 0 0 1 544 281 H628 A3 3 0 0 1 631 284 V300 Z" fill="#a9b3bf"/>
  <text x="586" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">161만원</text>
  <text x="586" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">실제 평균</text>
  <text x="586" y="342" text-anchor="middle" font-size="11" fill="#6b7280">연금저축 가입자 1인당</text>

  <text x="360" y="372" text-anchor="middle" font-size="11" fill="#6b7280">단위: 만원 · 한도는 2026년 9월 기준 소득세법·같은 법 시행령</text>
  <text x="360" y="388" text-anchor="middle" font-size="11" fill="#6b7280">평균은 2025년 말 연금저축 납입액 13조 5,000억원 ÷ 가입자 840만 3,000명(금융위·금감원 2026-06-18, 직접 계산)</text>
</svg>
