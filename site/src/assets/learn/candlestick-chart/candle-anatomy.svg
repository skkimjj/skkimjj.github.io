<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="358" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">캔들(봉) 하나가 기록하는 네 가지 가격</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">몸통은 시가와 종가 사이, 꼬리는 장중 최고가·최저가까지. 한국 차트는 양봉 빨강, 음봉 파랑</text>
  <g transform="translate(40,0)">
    <rect x="188.5" y="80" width="3" height="220" fill="#e0383e"/>
    <rect x="158" y="135" width="64" height="110" rx="2" fill="#e0383e"/>
    <rect x="228" y="79.5" width="18" height="1" fill="#9aa0aa"/>
    <text x="252" y="85" text-anchor="start" font-size="14" font-weight="700" fill="#1a1d24">고가</text>
    <rect x="228" y="134.5" width="18" height="1" fill="#9aa0aa"/>
    <text x="252" y="140" text-anchor="start" font-size="14" font-weight="700" fill="#1a1d24">종가</text>
    <rect x="228" y="244.5" width="18" height="1" fill="#9aa0aa"/>
    <text x="252" y="250" text-anchor="start" font-size="14" font-weight="700" fill="#1a1d24">시가</text>
    <rect x="228" y="299.5" width="18" height="1" fill="#9aa0aa"/>
    <text x="252" y="305" text-anchor="start" font-size="14" font-weight="700" fill="#1a1d24">저가</text>
    <text x="190" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">양봉 — 종가가 시가보다 높다</text>
    <rect x="448.5" y="80" width="3" height="220" fill="#2f6bd8"/>
    <rect x="418" y="135" width="64" height="110" rx="2" fill="#2f6bd8"/>
    <rect x="488" y="79.5" width="18" height="1" fill="#9aa0aa"/>
    <text x="512" y="85" text-anchor="start" font-size="14" font-weight="700" fill="#1a1d24">고가</text>
    <rect x="488" y="134.5" width="18" height="1" fill="#9aa0aa"/>
    <text x="512" y="140" text-anchor="start" font-size="14" font-weight="700" fill="#1a1d24">시가</text>
    <rect x="488" y="244.5" width="18" height="1" fill="#9aa0aa"/>
    <text x="512" y="250" text-anchor="start" font-size="14" font-weight="700" fill="#1a1d24">종가</text>
    <rect x="488" y="299.5" width="18" height="1" fill="#9aa0aa"/>
    <text x="512" y="305" text-anchor="start" font-size="14" font-weight="700" fill="#1a1d24">저가</text>
    <text x="450" y="338" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">음봉 — 종가가 시가보다 낮다</text>
    <rect x="110" y="83" width="1.5" height="49" fill="#9aa0aa"/>
    <rect x="110" y="83" width="8" height="1.5" fill="#9aa0aa"/>
    <rect x="110" y="130.5" width="8" height="1.5" fill="#9aa0aa"/>
    <text x="102" y="112.5" text-anchor="end" font-size="13" font-weight="400" fill="#6b7280">위꼬리</text>
    <rect x="110" y="138" width="1.5" height="104" fill="#9aa0aa"/>
    <rect x="110" y="138" width="8" height="1.5" fill="#9aa0aa"/>
    <rect x="110" y="240.5" width="8" height="1.5" fill="#9aa0aa"/>
    <text x="102" y="195.0" text-anchor="end" font-size="13" font-weight="400" fill="#6b7280">몸통</text>
    <rect x="110" y="248" width="1.5" height="49" fill="#9aa0aa"/>
    <rect x="110" y="248" width="8" height="1.5" fill="#9aa0aa"/>
    <rect x="110" y="295.5" width="8" height="1.5" fill="#9aa0aa"/>
    <text x="102" y="277.5" text-anchor="end" font-size="13" font-weight="400" fill="#6b7280">아래꼬리</text>
  </g>
</svg>
