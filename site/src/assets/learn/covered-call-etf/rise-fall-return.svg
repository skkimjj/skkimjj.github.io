  <text x="360" y="428" text-anchor="middle" font-size="11" fill="#6b7280">단위: % · NAV 기준, 분배금 단순 합산(재투자 가정 없음) · 두 구간은 길이가 다르다</text>
  <text x="360" y="444" text-anchor="middle" font-size="11" fill="#6b7280">FunETF 기준가 이력과 한국거래소 KIND 분배금 공시를 바탕으로 한 본 공부방 계산</text>
