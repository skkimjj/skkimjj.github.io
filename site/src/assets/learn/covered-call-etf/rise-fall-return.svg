<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="458" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">상승·하락 구간 분배금 포함 수익률</text>
  <text x="360" y="58" text-anchor="middle" font-size="12" fill="#6b7280">커버드콜 2개 상품(진한 색)은 상승은 덜 따라갔고, 하락은 기초지수 ETF와 거의 같았다</text>
  <text x="360" y="84" text-anchor="middle" font-size="12" fill="#6b7280">위 = 상승 구간(2024년 12월 30일~2026년 6월 30일, 18개월) · 아래 = 하락 구간(2026년 6월 30일~10월 19일, 3개월 반) · 같은 눈금</text>
  <rect x="52" y="320" width="616" height="1" fill="#c9ced6"/>
