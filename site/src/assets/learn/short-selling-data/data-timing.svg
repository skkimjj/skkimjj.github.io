<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">공매도 데이터가 화면에 올라오는 시각</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">정규장 마감(15:30) 이후 경과 시간 · 같은 공매도 데이터라도 화면마다 다릅니다</text>

  <!-- baseline (0분) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 막대는 위쪽만 둥글게(r=3), 하단은 직각으로 기준선에 딱 맞춘다 -->
  <!-- 공매도 거래(정규장분) : 10분 → 15:40 -->
  <path d="M118 300 V295 A3 3 0 0 1 121 292 H229 A3 3 0 0 1 232 295 V300 Z" fill="#7ea6d4"/>
  <text x="175" y="277" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">10분</text>
  <text x="175" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">공매도 거래</text>
  <text x="175" y="342" text-anchor="middle" font-size="11" fill="#6b7280">정규장분 · 15:40</text>

  <!-- 공매도 거래(당일 전체) : 160분 → 18:10 -->
  <path d="M306 300 V179 A3 3 0 0 1 309 176 H417 A3 3 0 0 1 420 179 V300 Z" fill="#7ea6d4"/>
  <text x="363" y="161" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">160분</text>
  <text x="363" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">공매도 거래</text>
  <text x="363" y="342" text-anchor="middle" font-size="11" fill="#6b7280">당일 전체 · 18:10</text>

  <!-- 공매도 과열종목 : 270분 → 20:00 -->
  <path d="M494 300 V93 A3 3 0 0 1 497 90 H605 A3 3 0 0 1 608 93 V300 Z" fill="#1f5fa8"/>
  <text x="551" y="75" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">270분</text>
  <text x="551" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">공매도 과열종목</text>
  <text x="551" y="342" text-anchor="middle" font-size="11" fill="#1f5fa8">당일자 · 20:00</text>

  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">과열종목이 가장 늦은 것은 20:00에 끝나는 넥스트레이드(NXT) 거래분까지 합산하기 때문입니다</text>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#9aa0aa">한국거래소 공매도 통계 각 화면 하단 주석 · 2026년 8월 30일 확인 · 공매도 잔고는 별도로 2영업일(T+2) 뒤에 공표</text>
</svg>
