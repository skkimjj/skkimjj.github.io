<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">공매도 과열종목 지정 요건 — 거래대금 증가배율 문턱</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">당일 공매도 거래대금이 직전 40거래일 평균의 몇 배인가</text>

  <!-- baseline (0배) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 막대는 위쪽만 둥글게(r=3), 하단은 직각으로 기준선에 딱 맞춘다 -->
  <!-- 코스피 유형①② : 6배 -->
  <path d="M118 300 V93 A3 3 0 0 1 121 90 H229 A3 3 0 0 1 232 93 V300 Z" fill="#1f5fa8"/>
  <text x="175" y="75" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">6배</text>
  <text x="175" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">코스피</text>
  <text x="175" y="342" text-anchor="middle" font-size="11" fill="#1f5fa8">유형 ①②</text>

  <!-- 코스닥·코넥스 유형①②③ : 5배 -->
  <path d="M306 300 V128 A3 3 0 0 1 309 125 H417 A3 3 0 0 1 420 128 V300 Z" fill="#7ea6d4"/>
  <text x="363" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">5배</text>
  <text x="363" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">코스닥·코넥스</text>
  <text x="363" y="342" text-anchor="middle" font-size="11" fill="#6b7280">유형 ①②③</text>

  <!-- 공통 유형④ : 2배 -->
  <path d="M494 300 V233 A3 3 0 0 1 497 230 H605 A3 3 0 0 1 608 233 V300 Z" fill="#7ea6d4"/>
  <text x="551" y="215" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">2배</text>
  <text x="551" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">공통</text>
  <text x="551" y="342" text-anchor="middle" font-size="11" fill="#6b7280">유형 ④</text>

  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">유형 ④는 문턱이 낮은 대신 공매도 비중 30% 이상·주가 3% 이상 하락 조건이 함께 붙습니다</text>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#9aa0aa">한국거래소 「공매도 과열종목 지정기준」 · 2025년 6월 1일부터 적용 중인 기준 · 2026년 8월 30일 확인</text>
</svg>
