<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">레메디 상장 첫날 가격 — 같은 하루 안에서</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">상장일 가격제한폭은 공모가의 60~400%입니다 (2026년 7월 13일 코스닥)</text>

  <!-- baseline (0원) -->
  <line x1="52" y1="300" x2="668" y2="300" stroke="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 공모가 20,700 -->
  <rect x="99" y="175" width="90" height="125" rx="3" fill="#1f5fa8"/>
  <text x="144" y="166" text-anchor="middle" font-size="15" font-weight="700" fill="#1f5fa8">20,700</text>
  <text x="144" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">공모가</text>

  <!-- 장중 최고 34,650 -->
  <rect x="246" y="90" width="90" height="210" rx="3" fill="#7ea6d4"/>
  <text x="291" y="81" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1d24">34,650</text>
  <text x="291" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">장중 최고</text>
  <text x="291" y="342" text-anchor="middle" font-size="11" fill="#6b7280">+67.4%</text>

  <!-- 장중 최저 21,200 -->
  <rect x="394" y="172" width="90" height="128" rx="3" fill="#7ea6d4"/>
  <text x="439" y="163" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1d24">21,200</text>
  <text x="439" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">장중 최저</text>
  <text x="439" y="342" text-anchor="middle" font-size="11" fill="#6b7280">+2.4%</text>

  <!-- 종가 22,000 -->
  <rect x="541" y="167" width="90" height="133" rx="3" fill="#7ea6d4"/>
  <text x="586" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1d24">22,000</text>
  <text x="586" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">종가</text>
  <text x="586" y="342" text-anchor="middle" font-size="11" fill="#6b7280">+6.3%</text>

  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">단위: 원 · 등락률은 공모가 20,700원 대비 · 장중 최고가에 사서 종가까지 보유했다면 −36.5%</text>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#9aa0aa">2026년 7월 13일 상장일 장 마감 후 언론 보도 기준</text>
</svg>
