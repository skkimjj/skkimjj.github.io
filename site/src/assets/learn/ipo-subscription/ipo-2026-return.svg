<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">2026년 상반기 상장 17곳 — 6월 말 기준 공모가 대비 수익률</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">기준선(0)에서 아래로 뻗은 막대 = 손실입니다</text>

  <!-- 항목 라벨 (막대가 아래로 자라므로 0선 위에 둔다) -->
  <text x="240" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">17곳 전체 평균</text>
  <text x="480" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">공모가 하회 13곳 평균</text>

  <!-- 기준선 0 -->
  <line x1="60" y1="120" x2="660" y2="120" stroke="#9aa0aa" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="668" y="116" text-anchor="start" font-size="12" fill="#6b7280">0</text>

  <!-- 17곳 전체 평균 : -14.1% (아래로) -->
  <rect x="175" y="120" width="130" height="72" rx="3" fill="#e0a6a0"/>
  <text x="240" y="216" text-anchor="middle" font-size="18" font-weight="700" fill="#c0392b">−14.1%</text>

  <!-- 공모가 하회 13곳 평균 : -37.0% (아래로) -->
  <rect x="415" y="120" width="130" height="190" rx="3" fill="#c0392b"/>
  <text x="480" y="334" text-anchor="middle" font-size="18" font-weight="700" fill="#c0392b">−37.0%</text>

  <text x="360" y="364" text-anchor="middle" font-size="11" fill="#9aa0aa">2026년 6월 말 종가 기준, 상반기 상장 17곳 대상 · 공모가를 웃돈 4곳의 평균은 +61%</text>
  <text x="360" y="382" text-anchor="middle" font-size="11" fill="#9aa0aa">상장 첫날 시초가 평균 수익률은 178.7%로 집계 · 2026년 7월 언론 보도 집계 기준</text>
</svg>
