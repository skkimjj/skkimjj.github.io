<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">정기보고서는 '며칠 이내'가 법으로 정해져 있습니다</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">결산기가 끝난 뒤 제출기한까지의 일수(자본시장법 제159조·제160조)</text>

  <!-- baseline (0) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 막대는 위쪽만 둥글게(r=3), 하단은 직각으로 기준선에 딱 맞춘다 -->
  <!-- 사업보고서 : 90일 -->
  <path d="M99 300 V93 A3 3 0 0 1 102 90 H186 A3 3 0 0 1 189 93 V300 Z" fill="#1f5fa8"/>
  <text x="144" y="76" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">90일</text>
  <text x="144" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">사업보고서</text>
  <text x="144" y="342" text-anchor="middle" font-size="11" fill="#1f5fa8">연간</text>

  <!-- 반기보고서 : 45일 -->
  <path d="M246 300 V198 A3 3 0 0 1 249 195 H333 A3 3 0 0 1 336 198 V300 Z" fill="#7ea6d4"/>
  <text x="291" y="181" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">45일</text>
  <text x="291" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">반기보고서</text>
  <text x="291" y="342" text-anchor="middle" font-size="11" fill="#6b7280">6개월분</text>

  <!-- 분기보고서 : 45일 -->
  <path d="M394 300 V198 A3 3 0 0 1 397 195 H481 A3 3 0 0 1 484 198 V300 Z" fill="#7ea6d4"/>
  <text x="439" y="181" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">45일</text>
  <text x="439" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">분기보고서</text>
  <text x="439" y="342" text-anchor="middle" font-size="11" fill="#6b7280">3개월·9개월분</text>

  <!-- 연결기준 최초 제출 : 60일 -->
  <path d="M541 300 V163 A3 3 0 0 1 544 160 H628 A3 3 0 0 1 631 163 V300 Z" fill="#7ea6d4"/>
  <text x="586" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">60일</text>
  <text x="586" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">연결기준 최초 제출</text>
  <text x="586" y="342" text-anchor="middle" font-size="11" fill="#6b7280">반기·분기, 2개 사업연도만</text>

  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">단위: 일 · 연결기준으로 반기·분기보고서를 처음 제출하는 법인은 최초 사업연도와 그다음 사업연도에 한해 15일 연장</text>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#9aa0aa">12월 결산법인 기준 2026년 마감일: 3/31 · 5/15 · 8/14 · 11/16 (DART 공시업무 스케줄, 2026년 9월 확인)</text>
</svg>
