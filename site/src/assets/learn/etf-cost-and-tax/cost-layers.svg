<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">앱에 적힌 총보수는 실제 부담의 5%였습니다</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">TIGER 미국S&#38;P500 한 상품의 비용 3층 구조</text>

  <!-- baseline (0%) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 막대는 위쪽만 둥글게(r=3), 하단은 직각으로 기준선에 딱 맞춘다 -->
  <!-- 총보수 : 0.0068% -->
  <path d="M121 300 V293 A3 3 0 0 1 124 290 H226 A3 3 0 0 1 229 293 V300 Z" fill="#7ea6d4"/>
  <text x="175" y="275" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">0.0068%</text>
  <text x="175" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">총보수</text>
  <text x="175" y="342" text-anchor="middle" font-size="11" fill="#6b7280">운용·지정참가·신탁·사무</text>

  <!-- 합성총보수(TER) : 0.0868% -->
  <path d="M306 300 V171 A3 3 0 0 1 309 168 H411 A3 3 0 0 1 414 171 V300 Z" fill="#7ea6d4"/>
  <text x="360" y="153" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">0.0868%</text>
  <text x="360" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">합성총보수(TER)</text>
  <text x="360" y="342" text-anchor="middle" font-size="11" fill="#6b7280">＋기타비용 약 0.08%p</text>

  <!-- 실부담비용 : 0.1381% -->
  <path d="M491 300 V93 A3 3 0 0 1 494 90 H596 A3 3 0 0 1 599 93 V300 Z" fill="#1f5fa8"/>
  <text x="545" y="75" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">0.1381%</text>
  <text x="545" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">실부담비용</text>
  <text x="545" y="342" text-anchor="middle" font-size="11" fill="#1f5fa8">＋매매·중개수수료 약 0.05%p</text>

  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">단위: 연 % · 총보수·기타비용은 미래에셋자산운용 공시(2025년 2월 6일 인하 시점), 실부담비용률은 금융투자협회 집계(2025년 2월 11일 보도 기준)</text>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#9aa0aa">총보수 연 0.0068%는 2026년 8월 3일 현재도 동일 · 상품 간 우열을 판단하는 자료가 아닙니다</text>
</svg>
