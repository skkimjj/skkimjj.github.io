<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">비용 0.9%포인트가 20년 뒤 494만원</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">1,000만원을 연 6% 수익으로 20년, 비용만 다르게 했을 때 최종 금액</text>

  <!-- baseline (0) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 막대는 위쪽만 둥글게(r=3), 하단은 직각으로 기준선에 딱 맞춘다 -->
  <!-- 비용 연 0.1% : 3,147만원 -->
  <path d="M121 300 V93 A3 3 0 0 1 124 90 H226 A3 3 0 0 1 229 93 V300 Z" fill="#1f5fa8"/>
  <text x="175" y="75" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">3,147만원</text>
  <text x="175" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">비용 연 0.1%</text>
  <text x="175" y="342" text-anchor="middle" font-size="11" fill="#1f5fa8">순수익률 5.9%</text>

  <!-- 비용 연 0.5% : 2,918만원 -->
  <path d="M306 300 V108 A3 3 0 0 1 309 105 H411 A3 3 0 0 1 414 108 V300 Z" fill="#7ea6d4"/>
  <text x="360" y="90" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">2,918만원</text>
  <text x="360" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">비용 연 0.5%</text>
  <text x="360" y="342" text-anchor="middle" font-size="11" fill="#6b7280">순수익률 5.5%</text>

  <!-- 비용 연 1.0% : 2,653만원 -->
  <path d="M491 300 V126 A3 3 0 0 1 494 123 H596 A3 3 0 0 1 599 126 V300 Z" fill="#7ea6d4"/>
  <text x="545" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">2,653만원</text>
  <text x="545" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">비용 연 1.0%</text>
  <text x="545" y="342" text-anchor="middle" font-size="11" fill="#6b7280">순수익률 5.0%</text>

  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">단위: 만원 · 원금 1,000만원, 연 총수익률 6% 가정 후 비용을 차감한 자체 계산(세금 제외)</text>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#9aa0aa">비용 효과만 보기 위한 예시이며 수익률 전망이 아닙니다</text>
</svg>
