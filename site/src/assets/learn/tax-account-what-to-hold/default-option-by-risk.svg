  <text x="360" y="366" text-anchor="middle" font-size="11" fill="#6b7280">DC·IRP 적립금 합계(조원)·상품 수 · 자료: 금융감독원 통합연금포털 디폴트옵션 비교공시, 본 공부방 합산</text>
