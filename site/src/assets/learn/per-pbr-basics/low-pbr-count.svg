<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">지수는 2.8배 올랐는데, 저평가 기업 수는 그대로였습니다</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">코스피 상장사 중 PBR이 1배 미만인 기업 수(곳)</text>

  <!-- baseline (0) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 막대는 위쪽만 둥글게(r=3), 하단은 직각으로 기준선에 딱 맞춘다 -->
  <!-- 1년 전(코스피 3,000선) : 562곳 -->
  <path d="M99 300 V84 A3 3 0 0 1 102 81 H186 A3 3 0 0 1 189 84 V300 Z" fill="#7ea6d4"/>
  <text x="144" y="67" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">562곳</text>
  <text x="144" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">1년 전</text>
  <text x="144" y="342" text-anchor="middle" font-size="11" fill="#6b7280">코스피 3,000선</text>

  <!-- 2025.12.29(4,100선) : 556곳 -->
  <path d="M246 300 V87 A3 3 0 0 1 249 84 H333 A3 3 0 0 1 336 87 V300 Z" fill="#7ea6d4"/>
  <text x="291" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">556곳</text>
  <text x="291" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">2025.12.29</text>
  <text x="291" y="342" text-anchor="middle" font-size="11" fill="#6b7280">4,100선</text>

  <!-- 2026.3월 말(5,400선) : 530곳 -->
  <path d="M394 300 V97 A3 3 0 0 1 397 94 H481 A3 3 0 0 1 484 97 V300 Z" fill="#7ea6d4"/>
  <text x="439" y="80" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">530곳</text>
  <text x="439" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">2026.3월 말</text>
  <text x="439" y="342" text-anchor="middle" font-size="11" fill="#6b7280">5,400선</text>

  <!-- 2026.6.29(8,394.65) : 565곳 -->
  <path d="M541 300 V83 A3 3 0 0 1 544 80 H628 A3 3 0 0 1 631 83 V300 Z" fill="#1f5fa8"/>
  <text x="586" y="66" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">565곳</text>
  <text x="586" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">2026.6.29</text>
  <text x="586" y="342" text-anchor="middle" font-size="11" fill="#1f5fa8">8,394.65</text>

  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">단위: 곳 · 한국거래소 집계를 인용한 2026년 6월 30일 보도</text>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#9aa0aa">같은 기간 코스피 지수는 3,000선에서 8,394.65로 약 2.8배 올랐습니다</text>
</svg>
