<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">10년 뒤 받을 100만원은 지금 얼마짜리인가</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">할인율만 바꿨을 때 현재가치 · 100 ÷ (1+할인율)의 10제곱</text>

  <!-- baseline (0) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 막대는 위쪽만 둥글게(r=3), 하단은 직각으로 기준선에 딱 맞춘다 -->
  <!-- 할인율 3% : 74.4만원 -->
  <path d="M98 300 V103 A3 3 0 0 1 101 100 H191 A3 3 0 0 1 194 103 V300 Z" fill="#7ea6d4"/>
  <text x="146" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">74.4만원</text>
  <text x="146" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">할인율 3%</text>

  <!-- 할인율 5% : 61.4만원 -->
  <path d="M240 300 V138 A3 3 0 0 1 243 135 H333 A3 3 0 0 1 336 138 V300 Z" fill="#7ea6d4"/>
  <text x="288" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">61.4만원</text>
  <text x="288" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">할인율 5%</text>

  <!-- 할인율 7% : 50.8만원 -->
  <path d="M382 300 V166 A3 3 0 0 1 385 163 H475 A3 3 0 0 1 478 166 V300 Z" fill="#7ea6d4"/>
  <text x="430" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">50.8만원</text>
  <text x="430" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">할인율 7%</text>

  <!-- 할인율 9% : 42.2만원 -->
  <path d="M524 300 V189 A3 3 0 0 1 527 186 H617 A3 3 0 0 1 620 189 V300 Z" fill="#1f5fa8"/>
  <text x="572" y="171" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">42.2만원</text>
  <text x="572" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">할인율 9%</text>
  <text x="572" y="342" text-anchor="middle" font-size="11" fill="#1f5fa8">3%일 때의 절반 수준</text>

  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">단위: 만원 · 미래 금액 100만원, 기간 10년으로 고정한 자체 계산 예시</text>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#9aa0aa">특정 자산의 수익률 전망이 아니라 할인율의 효과만 보기 위한 계산입니다</text>
</svg>
