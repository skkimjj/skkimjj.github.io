<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="428" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">삼성전자 2025년 10월 대비 2026년 10월 변화율</text>
  <text x="360" y="58" text-anchor="middle" font-size="12" fill="#6b7280">파랑 = 증가, 붉은색 = 감소 · 같은 눈금 · 주가가 오르면서 거래량은 줄었지만 거래대금은 늘었다</text>
  <rect x="90" y="300" width="540" height="1" fill="#c9ced6"/>
  <text x="84" y="304" text-anchor="end" font-size="12" fill="#6b7280">0</text>
  <path d="M120 300 V130.9 A3 3 0 0 1 123 127.9 H237 A3 3 0 0 1 240 130.9 V300 Z" fill="#0f4bd8" fill-opacity="0.4"/>
  <text x="180" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">+143.4%</text>
  <path d="M300 301 V341.6 A3 3 0 0 0 303 344.6 H417 A3 3 0 0 0 420 341.6 V301 Z" fill="#b43c3c" fill-opacity="0.45"/>
  <text x="360" y="361" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">−36.3%</text>
  <path d="M480 300 V237 A3 3 0 0 1 483 234 H597 A3 3 0 0 1 600 237 V300 Z" fill="#0f4bd8" fill-opacity="0.4"/>
  <text x="540" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1d24">+55.0%</text>
  <text x="180" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">평균 종가</text>
  <text x="180" y="403" text-anchor="middle" font-size="11" fill="#6b7280">97,111원 → 236,361원</text>
  <text x="360" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">일평균 거래량</text>
  <text x="360" y="403" text-anchor="middle" font-size="11" fill="#6b7280">2,561만주 → 1,631만주</text>
  <text x="540" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">일평균 거래대금</text>
  <text x="540" y="403" text-anchor="middle" font-size="11" fill="#6b7280">2조 4,750억원 → 3조 8,375억원</text>
  <text x="360" y="422" text-anchor="middle" font-size="10" fill="#6b7280">2025년 10월(18거래일)·2026년 10월 1~28일(18거래일) 일평균 · 정규장 체결 기준 · 다음 금융 일별 시세로 본 공부방 계산</text>
</svg>
