<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="378" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">ISA 가입금액 추이 — 6조원에서 65조원으로</text>

  <!-- baseline -->
  <line x1="50" y1="300" x2="670" y2="300" stroke="#e5e7eb"/>

  <!-- 2020.12: 6조 -->
  <rect x="110" y="282" width="64" height="18" rx="3" fill="#0f4bd8" fill-opacity="0.4"/>
  <text x="142" y="275" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">6조</text>
  <text x="142" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1d24">2020.12</text>
  <text x="142" y="338" text-anchor="middle" font-size="11" fill="#6b7280">194만명</text>

  <!-- 2025.11: 46.5조 -->
  <rect x="260" y="158" width="64" height="142" rx="3" fill="#0f4bd8" fill-opacity="0.4"/>
  <text x="292" y="151" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">46.5조</text>
  <text x="292" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1d24">2025.11</text>
  <text x="292" y="338" text-anchor="middle" font-size="11" fill="#6b7280">719만명</text>

  <!-- 2026.2: 59조 -->
  <rect x="410" y="120" width="64" height="180" rx="3" fill="#0f4bd8" fill-opacity="0.4"/>
  <text x="442" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">59조</text>
  <text x="442" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1d24">2026.2</text>
  <text x="442" y="338" text-anchor="middle" font-size="11" fill="#6b7280">848만명</text>

  <!-- 2026.4: 65.6조 -->
  <rect x="560" y="100" width="64" height="200" rx="3" fill="#0f4bd8"/>
  <text x="592" y="93" text-anchor="middle" font-size="13" font-weight="700" fill="#0f4bd8">65.6조</text>
  <text x="592" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#0f4bd8">2026.4</text>
  <text x="592" y="338" text-anchor="middle" font-size="11" fill="#6b7280">902만명</text>

  <text x="360" y="366" text-anchor="middle" font-size="11" fill="#6b7280">각 시점 말일 기준 가입금액(조원)·가입자 수 · 자료: 금융투자협회 ISA 다모아, 국회예산정책처</text>
</svg>
