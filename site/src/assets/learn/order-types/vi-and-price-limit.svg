<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect x="1" y="1" width="718" height="398" rx="10" fill="#f7f8fa" stroke="#e5e7eb"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1d24">시장가 주문이 넘을 수 없는 벽</text>
  <text x="360" y="54" text-anchor="middle" font-size="12" fill="#6b7280">변동성완화장치(VI)가 2분간 멈춰 세우고, 가격제한폭이 하루 한도를 정합니다</text>

  <!-- baseline (0%) — 막대 아래쪽에만 놓아 막대 하단을 침범하지 않게 한다 -->
  <rect x="52" y="300" width="616" height="1" fill="#c9ced6"/>
  <text x="46" y="304" text-anchor="end" font-size="11" fill="#9aa0aa">0</text>

  <!-- 막대는 위쪽만 둥글게(r=3), 하단은 직각으로 기준선에 딱 맞춘다 -->
  <!-- 동적 VI 코스피200 : 3% -->
  <path d="M99 300 V282 A3 3 0 0 1 102 279 H186 A3 3 0 0 1 189 282 V300 Z" fill="#7ea6d4"/>
  <text x="144" y="267" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">3%</text>
  <text x="144" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">동적 VI</text>
  <text x="144" y="342" text-anchor="middle" font-size="11" fill="#6b7280">코스피200 종목</text>

  <!-- 동적 VI 그 외 : 6% -->
  <path d="M246 300 V261 A3 3 0 0 1 249 258 H333 A3 3 0 0 1 336 261 V300 Z" fill="#7ea6d4"/>
  <text x="291" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">6%</text>
  <text x="291" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">동적 VI</text>
  <text x="291" y="342" text-anchor="middle" font-size="11" fill="#6b7280">그 외 종목</text>

  <!-- 정적 VI : 10% -->
  <path d="M394 300 V233 A3 3 0 0 1 397 230 H481 A3 3 0 0 1 484 233 V300 Z" fill="#7ea6d4"/>
  <text x="439" y="218" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1d24">10%</text>
  <text x="439" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1d24">정적 VI</text>
  <text x="439" y="342" text-anchor="middle" font-size="11" fill="#6b7280">전 종목</text>

  <!-- 가격제한폭 : 30% -->
  <path d="M541 300 V93 A3 3 0 0 1 544 90 H628 A3 3 0 0 1 631 93 V300 Z" fill="#1f5fa8"/>
  <text x="586" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#1f5fa8">30%</text>
  <text x="586" y="324" text-anchor="middle" font-size="13" font-weight="700" fill="#1f5fa8">가격제한폭</text>
  <text x="586" y="342" text-anchor="middle" font-size="11" fill="#1f5fa8">하루 한도</text>

  <text x="360" y="368" text-anchor="middle" font-size="11" fill="#9aa0aa">동적 VI는 직전 체결가 대비 · 정적 VI는 직전 단일가 대비 · 가격제한폭은 기준가격(대개 전일 종가) 대비</text>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#9aa0aa">한국거래소 규정 2026년 8월 기준 · 동적 VI는 접속매매 시간(09:00~15:20) 기준, 종가 단일가에는 2%·4%</text>
</svg>
